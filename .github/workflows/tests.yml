name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        # The app extra too, so tests/test_app.py drives the real pages in CI
        # instead of skipping for want of Streamlit.
        run: pip install -e ".[dev,app]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
